    <title>Alejandro Vargas · Full-Stack Developer</title>
    <meta name="description" content="Alejandro Vargas, full-stack developer focused on backend, cloud, and data. Passionate about building production-ready software and making real-world data useful." />

    <!-- So dark-mode visitors never see a white flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191919" />
